version: 1

ev_data:
  # CSV file path for simulating data crawler
  data_file: "/data/data_ev_parking_duration.csv"
  output_stream: "ev.charging.sessions"
  location: "Genk Henri Esserslaan 47"
  # Simulation parameters
  replay_speed: 1   # hours worth of data per minute (slower)
  batch_size: 1     # sessions per batch (smaller batches)

redis:
  host: "redis"
  port: 6379
  db: 0
  password: ${REDIS_PASSWORD}

logging:
  loggers:
    ev_data:
      level: "INFO"
      handlers: ["console"]
