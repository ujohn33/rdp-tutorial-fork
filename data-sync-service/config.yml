# The version of the configuration file. Currently, only version 1 is supported.
version: 1

x-channels:
  # ---------------------------------------------------------------------------
  # Template for EV charging session data formats
  # ---------------------------------------------------------------------------
  ev-sessions:
    encoding: &ev-sessions-encoding
      _default: "KeepEncoding"
      timestamp: "KeepEncoding"
      sessions: "JSON"
      start_time: "JSONDatetimeString"
      end_time: "JSONDatetimeString"
    steps: &ev-sessions-steps
      - type: "CachedSQLQuery"
        cache keys: ["location", "data_provider"]
        single value: True
        query: "SELECT get_or_create_data_point_id('ev_sessions_jsonb', 'jsonb', 'unitemporal', :location, :data_provider) AS dp_id;"
      - type: "UnpackArrayValues"
        unpack keys: ["sessions"]
    data sink: &ev-sessions-sink
      table: "raw_unitemporal_jsonb"
      columns:
        dp_id: "dp_id"
        valid_time: "timestamp"
        value: "sessions"

  ## ---------------------------------------------------------------------------
  ## Template for EV prediction data formats
  ## ---------------------------------------------------------------------------
  ev-predictions:
    encoding: &ev-predictions-encoding
      _default: "JSON"
      timestamp: "JSONDatetimeString"
      hourly_timestamps: "JSON"
      hourly_energy_kwh: "JSON"
      hourly_duration_min: "JSON"
      daily_timestamps: "JSON"
      daily_energy_kwh: "JSON"
      daily_duration_min: "JSON"
    steps: &ev-predictions-steps
      - type: "SplitByKey"
        always include: ["timestamp", "location", "data_provider"]
        destination key: "value"
        source output key: "prediction_type"
      - type: "CachedSQLQuery"
        cache keys: ["location", "data_provider", "prediction_type"]
        single value: True
        query: "SELECT get_or_create_data_point_id(:prediction_type, NULL, :location, :data_provider) AS dp_id;"
      - type: "UnpackArrayValues"
        unpack keys: ["hourly_timestamps", "value"]
    data sink: &ev-predictions-sink
      table: "forecasts"
      update duplicate values: True
      columns:
        dp_id: "dp_id"
        obs_time: "hourly_timestamps"
        fc_time: "timestamp"
        value: "value"

## The list of channel configurations. Each configuration specifies a single chain of processing steps
channels:
  ## ---------------------------------------------------------------------------
  ## EV charging session data
  ## ---------------------------------------------------------------------------
  ev.charging.sessions:
    trigger:
      stream id: "ev.charging.sessions"
      trim length: 500
    encoding: *ev-sessions-encoding
    steps: *ev-sessions-steps
    data sink: *ev-sessions-sink
  ## ---------------------------------------------------------------------------
  ## EV prediction data
  ## ---------------------------------------------------------------------------
  ev.predictions:
    trigger:
      stream id: "ev.predictions"
      trim length: 100
    encoding: *ev-predictions-encoding
    steps: *ev-predictions-steps
    data sink: *ev-predictions-sink


## The connection to the destination database
database connection: !env-template "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescale/rdp_db"
redis:
  host: redis
  port: 6379
  db: 0
  password: ${REDIS_PASSWORD}
