# The version of the configuration file. Currently, only version 1 is supported.
version: 1

x-channels:
  # ---------------------------------------------------------------------------
  # Template for EV charging session data formats
  # ---------------------------------------------------------------------------
  ev-sessions:
    encoding: &ev-sessions-encoding
      _default: "KeepEncoding"
      timestamp: "DatetimeString"
      session_times: "JSONListWithDatetimeStrings"
      kwh_values: "JSON"
      duration_values: "JSON"
      user_ids: "JSON"
    steps: &ev-sessions-steps
      - type: "SplitByKey"
        always include: ["timestamp", "session_times", "location", "data_provider"]
        destination key: "value"
        source output key: "metric_type"
        split keys:
          kwh_values: "kwh_values"
          duration_values: "duration_values"
      - type: "CachedSQLQuery"
        cache keys: ["location", "data_provider", "metric_type"]
        single value: True
        query: "SELECT get_or_create_data_point_id(CONCAT('ev_sessions_', :metric_type), NULL, :location, :data_provider) AS dp_id;"
      - type: "UnpackArrayValues"
        unpack keys: ["session_times", "value"]
    data sink: &ev-sessions-sink
      table: "forecasts"
      update duplicate values: True
      columns:
        dp_id: "dp_id"
        obs_time: "session_times"
        fc_time: "timestamp"
        value: "value"

  ## ---------------------------------------------------------------------------
  ## Template for EV prediction data formats
  ## ---------------------------------------------------------------------------
  ev-predictions:
    encoding: &ev-predictions-encoding
      _default: "KeepEncoding"
      timestamp: "DatetimeString"
      arrival_time: "DatetimeString"
      predicted_kwh: "KeepEncoding"
      predicted_duration_minutes: "KeepEncoding"
      prediction_runtime: "KeepEncoding"
    steps: &ev-predictions-steps
      - type: "SplitByKey"
        always include: ["timestamp", "arrival_time", "location", "data_provider", "user_id", "prediction_runtime"]
        destination key: "value"
        source output key: "prediction_type"
        split keys:
          predicted_kwh: "predicted_kwh"
          predicted_duration_minutes: "predicted_duration_minutes"
      - type: "CachedSQLQuery"
        cache keys: ["location", "data_provider", "prediction_type"]
        single value: True
        query: "SELECT get_or_create_data_point_id(:prediction_type, NULL, :location, :data_provider) AS dp_id;"
    data sink: &ev-predictions-sink
      table: "forecasts"
      update duplicate values: True
      columns:
        dp_id: "dp_id"
        obs_time: "arrival_time"
        fc_time: "timestamp"
        value: "value"

## The list of channel configurations. Each configuration specifies a single chain of processing steps
channels:
  ## ---------------------------------------------------------------------------
  ## EV charging session data
  ## ---------------------------------------------------------------------------
  ev.charging.sessions:
    trigger:
      stream id: "ev.charging.sessions"
      trim length: 500
    encoding: *ev-sessions-encoding
    steps: *ev-sessions-steps
    data sink: *ev-sessions-sink
  ## ---------------------------------------------------------------------------
  ## EV prediction data
  ## ---------------------------------------------------------------------------
  ev.predictions:
    trigger:
      stream id: "ev.predictions"
      trim length: 100
    encoding: *ev-predictions-encoding
    steps: *ev-predictions-steps
    data sink: *ev-predictions-sink


## The connection to the destination database
database connection: !env-template "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescale/rdp_db"
redis:
  host: redis
  port: 6379
  db: 0
  password: ${REDIS_PASSWORD}
